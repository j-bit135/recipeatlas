<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c2622a"/>
      <stop offset="100%" style="stop-color:#e8832a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Globe circle -->
  <circle cx="38" cy="32" r="18" stroke="#fff" stroke-width="2.5" fill="none"/>
  <!-- Globe latitude lines -->
  <path d="M20 32 Q38 24 56 32" stroke="#fff" stroke-width="2" fill="none"/>
  <path d="M20 32 Q38 40 56 32" stroke="#fff" stroke-width="2" fill="none"/>
  <!-- Globe vertical axis -->
  <line x1="38" y1="14" x2="38" y2="50" stroke="#fff" stroke-width="2"/>
  <!-- Fork handle -->
  <line x1="12" y1="14" x2="12" y2="50" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Fork tines -->
  <line x1="7" y1="14" x2="7" y2="26" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="17" y1="14" x2="17" y2="26" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Fork tine curve -->
  <path d="M7 26 Q12 33 17 26" stroke="#fff" stroke-width="2.5" fill="none"/>
</svg>
